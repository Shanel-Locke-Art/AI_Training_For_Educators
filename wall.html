<!DOCTYPE html>
<html lang="en">
<head>
  <!-- IDEAS WALL PAGE MAP: metadata/assets, page styles, wall form, local script -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptCraft — Ideas Wall</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Nunito:wght@400;600;700;800&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/wall.css?v=320">
</head>
<body>

<header class="wall-header">
  <div class="wall-badge">🌿 PromptCraft</div>
  <div class="wall-title">The <em>Ideas</em> Wall</div>
  <div class="wall-subtitle">
    Real instructional ideas generated during the Prompt Lab —
    submitted anonymously by educators like you.
  </div>
  <div class="wall-stats">
    <div class="wall-stat">
      <div class="wall-stat-num" id="statTotal">—</div>
      <div class="wall-stat-label">Ideas shared</div>
    </div>
    <div class="wall-stat">
      <div class="wall-stat-num" id="statScenarios">—</div>
      <div class="wall-stat-label">Scenarios covered</div>
    </div>
  </div>
</header>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" type="button" data-filter="all">All Ideas</button>
  <button class="filter-btn" type="button" data-filter="1">Engagement</button>
  <button class="filter-btn" type="button" data-filter="2">Differentiation</button>
  <button class="filter-btn" type="button" data-filter="3">Assessment</button>
</div>

<main class="wall-grid" id="wallGrid" aria-live="polite">
  <div class="wall-state">
    <span class="wall-state-icon">🌿</span>
    <div class="wall-state-title">Loading ideas</div>
    <div class="wall-state-sub">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
</main>

<div class="back-bar">
  <button class="refresh-btn" id="refreshIdeasBtn" type="button">↻ Refresh</button>
  <br><br>
  <a class="back-link" href="index.html">← Back to PromptCraft</a>
</div>

<script src="functions/wall.js?v=320"></script>
</body>
</html>
